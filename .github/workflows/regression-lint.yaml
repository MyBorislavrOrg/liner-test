name: Regression - shared lint config JSON validation

on:
  push:
    paths:
      - "config/linters/eslint.config.mjs"
      - "fixtures/**"
      - ".github/workflows/regression-lint.yaml"
  pull_request:
    paths:
      - "config/linters/eslint.config.mjs"
      - "fixtures/**"
      - ".github/workflows/regression-lint.yaml"
  workflow_dispatch: {}

# Super-Linter version is pinned as a literal tag on every `uses:` line
# below, since GitHub Actions does not evaluate expressions in `uses:`.
# Keep every occurrence below (and the shared run-lint workflow) in sync -
# Dependabot/Renovate will bump all matching pins in this file together.

jobs:
  # --- Negative path: malformed JSON must fail --------------------------
  expect-fail-on-malformed-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No DEFAULT_WORKSPACE override: in GitHub Actions, Super-Linter
      # always operates on GITHUB_WORKSPACE (the runner's mounted
      # checkout) regardless of DEFAULT_WORKSPACE. Instead we scope the
      # scan to just this fixture via FILTER_REGEX_INCLUDE.
      - name: Run Super-Linter against malformed JSON
        id: lint
        continue-on-error: true
        uses: super-linter/super-linter@v8.7.0 # keep in sync with the shared run-lint workflow's pin
        env:
          VALIDATE_ALL_CODEBASE: "true"
          FILTER_REGEX_INCLUDE: "malformed.json"
          VALIDATE_JSON: "true"
          VALIDATE_JAVASCRIPT_ES: "true"
          VALIDATE_TYPESCRIPT_ES: "true"
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          LINTER_RULES_PATH: config/linters
          CREATE_LOG_FILE: "true"
          LOG_FILE: super-linter.log # written to ${GITHUB_WORKSPACE}/super-linter.log
          LOG_LEVEL: DEBUG
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert run-lint actually failed
        run: |
          if [ "${{ steps.lint.outcome }}" != "failure" ]; then
            echo "::error::Expected run-lint to FAIL on malformed.json, but it passed."
            exit 1
          fi

      - name: Assert the file was linted, not silently ignored
        run: |
          LOG="${GITHUB_WORKSPACE}/super-linter.log"
          # Also fail loudly if the ERR_MODULE_NOT_FOUND regression from
          # eslint.config.mjs (e.g. an unbundled import or an unregistered
          # plugin) resurfaces - that would make run-lint red for the
          # wrong reason, not because malformed.json is actually invalid.
          if grep -qi "no matching configuration was supplied" "$LOG" 2>/dev/null; then
            echo "::error::malformed.json was ignored instead of being linted."
            exit 1
          fi
          if grep -qi "ERR_MODULE_NOT_FOUND\|could not find plugin" "$LOG" 2>/dev/null; then
            echo "::error::eslint.config.mjs failed to load; JSON was not actually linted."
            exit 1
          fi

  # --- Positive path: valid JSON/JS/TS must pass -------------------------
  expect-pass-on-valid-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter against valid fixtures
        id: lint
        uses: super-linter/super-linter@v8.7.0 # keep in sync with the shared run-lint workflow's pin
        env:
          VALIDATE_ALL_CODEBASE: "true"
          FILTER_REGEX_INCLUDE: "(valid.json|valid.js|valid.ts)$"
          VALIDATE_JSON: "true"
          VALIDATE_JAVASCRIPT_ES: "true"
          VALIDATE_TYPESCRIPT_ES: "true"
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          LINTER_RULES_PATH: config/linters
          LOG_LEVEL: DEBUG
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No continue-on-error here: a real failure means the fix broke
        # existing green JS/TS/valid-JSON behavior, and the job should fail.

  # --- Gate: both expectations must hold ---------------------------------
  regression-gate:
    needs: [expect-fail-on-malformed-json, expect-pass-on-valid-fixtures]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Both negative and positive paths behaved as expected."
